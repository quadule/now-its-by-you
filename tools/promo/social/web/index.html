<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Social cut</title>
<style>
  html, body { margin: 0; background: #f4ecdc; }
  canvas { display: block; }
  body:not(.capture) canvas { height: 96vh; width: auto; margin: 2vh auto; }
  #bar { position: fixed; left: 8px; bottom: 8px; color: #554737; font: 13px sans-serif; }
  body.capture #bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="bar"><input id="t" type="range" min="0" max="48" step="0.01" value="0" style="width:40vw"> <span id="tt"></span> <button id="play">play</button></div>
<script type="module" src="cut.js"></script>
</body>
</html>
