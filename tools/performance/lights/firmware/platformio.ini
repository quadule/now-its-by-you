; The lanterns: one firmware for the host (on the laptop's USB) and every lantern.
;   pio run -t upload && pio device monitor
[env:tdisplay]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    makuna/NeoPixelBus@2.8.3
build_flags =
    -DLED_PIN=27
    -DNUM_LEDS=40
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=40000000
