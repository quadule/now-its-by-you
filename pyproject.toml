[project]
name = "songbird"
version = "0.1.0"
description = "A folk song whose real artifact is the program that sings it."
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.11"
dependencies = [
    "cmudict>=1.1.3",
    "numba>=0.67.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.scripts]
songbird = "songbird.cli:main"

[dependency-groups]
# Development only: verification of renders (pitch tracking, plots).
dev = [
    "pytest>=8",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
