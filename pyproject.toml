[project]
name = "songbird"
version = "0.2.0"
description = "Now It's by You: a folk song whose audio files carry the program that sings new versions of it."
readme = "README.md"
license = "CC0-1.0"
authors = [{ name = "Milo Winningham" }]
requires-python = ">=3.11"
dependencies = [
    "cmudict>=1.1.3",
    "numba>=0.67.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://now.itsby.you"
Studio = "https://studio.itsby.you"
Source = "https://github.com/quadule/songbird"

[project.scripts]
songbird = "songbird.cli:main"

[dependency-groups]
# Development only: verification of renders (pitch tracking, plots).
dev = [
    "pytest>=8",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "faster-whisper>=1.2.1",
    "pyworld>=0.3.5",
    "setuptools<81",
]
# Singing in a studio run from a checkout (webstudio/, songbird studio --web-singing): measuring a sung take.
# Never in a packet; studio.itsby.you measures in the browser instead. No speech recogniser: sung takes don't need one.
web-singing = [
    "librosa>=0.10",
    "pyworld>=0.3.5",
    "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
