# Songbird's page for singers anywhere: docs/SING-ONLINE.md has every step.
# Build the site first (uv run python tools/sing_site.py), then `npx wrangler deploy` from this folder.
name = "songbird-sing"
main = "src/worker.js"
compatibility_date = "2026-09-25"

# It starts on https://songbird-sing.<your-subdomain>.workers.dev; once quadule.com's DNS is on
# Cloudflare, uncomment the route below and deploy again to serve it at songbird.quadule.com.
workers_dev = true
preview_urls = false
routes = [{ pattern = "songbird.quadule.com", custom_domain = true }, { pattern = "now.itsby.you", custom_domain = true },
          { pattern = "itsby.you", custom_domain = true }, { pattern = "www.itsby.you", custom_domain = true }]  # the last two redirect to now.itsby.you

# The dates singing keeps (ISO 8601, Pacific time). Singing closes at CLOSES_AT: no more joining, takes,
# words or withdrawing after it (singers' own pages keep working). At DELETE_BY the hourly purge deletes
# every take and file, and every email but those of singers who asked to hear when the song is released.
# They must match what web/sing/consent.md tells singers.
[vars]
CLOSES_AT = "2026-09-27T22:00:00-07:00"
DELETE_BY = "2026-09-30T20:00:00-07:00"
# Joins from one address in an hour. A choir singing together on one Wi-Fi shares an address: raise it
# for a session like that, and deploy again.
JOINS_AN_HOUR = "20"
# The public seed page (the song's file and how to run it) is at /seed on every host, and at the root of this
# host, which the second custom-domain route above serves (itsby.you's DNS is on Cloudflare since 2026-09-27).
SEED_HOST = "now.itsby.you"
# Singing happens in the studio now (2026-09-30): every invitation's page says so, with a link here, and
# nothing more is sung or sent on this site. Singers' own pages (/y/) and the seed page are as they were.
# Remove it to open singing here again.
STUDIO_URL = "https://studio.itsby.you"

# Every hour, on the hour: forget the addresses counted for joining, and after DELETE_BY, the purge.
[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
# The worker sees the pages' own addresses, the API and the song (served only to open invitations);
# the pages' scripts and styles are served straight from the assets, with public/_headers. (robots.txt goes
# through the worker: only the singing site's host has one.)
run_worker_first = ["/", "/robots.txt", "/index.html", "/yours.html", "/seed.html", "/seed", "/seed/*", "/history", "/history.html", "/i/*", "/y/*", "/api/*", "/song/*"]
html_handling = "none"
not_found_handling = "none"

# Invitations. Create the namespace with `npx wrangler kv namespace create INVITES`
# and paste the id it prints here.
[[kv_namespaces]]
binding = "INVITES"
id = "aa2b6ac9172d4276a186ac9e648a8c57"

# Takes, private: `npx wrangler r2 bucket create songbird-takes`. Never make this bucket public. As a
# backstop to the purge, have R2 itself delete takes and files after 30 September
# (docs/SING-ONLINE.md, "Put it online").
[[r2_buckets]]
binding = "TAKES"
bucket_name = "songbird-takes"

# About 6 takes (or words) a minute from one singer, 120 requests a minute from one address, and 10 a
# minute from an address asking after invitations or pages that don't exist. Counted at each Cloudflare
# location, so a little loose; the address is only a key for the count, held briefly and never stored.
# (Joining is also held to JOINS_AN_HOUR from one address, counted in R2 by a digest of it, forgotten
# within the hour.)
[[ratelimits]]
name = "UPLOADS"
namespace_id = "1701"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "REQUESTS"
namespace_id = "1702"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "UNKNOWN"
namespace_id = "1703"
simple = { limit = 10, period = 60 }

# No logs kept: requests carry invitation tokens, the links to singers' own pages, names and emails.
[observability]
enabled = false

# The admin API's secret, ADMIN_TOKEN, is set after the first deploy with `npx wrangler secret put
# ADMIN_TOKEN` (for `wrangler dev`, in .dev.vars); until then the admin API answers 503.
