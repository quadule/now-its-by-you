<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songbird in the browser</title>
<style>
  :root { --paper: #f7f2e7; --ink: #2b2118; --rule: #b9a98f; --red: #9a2d1f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1d1914; --ink: #eee4cf; --rule: #5e5242; --red: #e07a5f; } }
  body { background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; margin: 0 auto;
         max-width: 44rem; padding: 1rem; }
  h1 { font: 600 1.4rem Georgia, serif; border-bottom: 3px double var(--rule); padding-bottom: .3rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .6rem 0; }
  button, select { font: inherit; background: transparent; color: var(--ink); border: 1px solid var(--ink);
                   padding: .25rem .7rem; border-radius: 2px; }
  button:disabled { opacity: .45; }
  pre { white-space: pre-wrap; font: 13px/1.45 ui-monospace, monospace; border-left: 2px solid var(--rule);
        padding-left: .7rem; }
  .id { color: var(--red); word-break: break-all; }
  audio { width: 100%; }
</style>
</head>
<body>
<h1>Songbird, sung in this browser</h1>
<p>A feasibility prototype (docs/notes/BROWSER-RENDER.md): the program itself in Pyodide, its sample loops in
JavaScript or WebAssembly, rendering the seed of <i>Now It's By You</i> here, not on a server.</p>
<div class="row">
  <label>Kernels <select id="mode"><option value="wasm">C/wasm + JS</option><option value="js">JS only</option></select></label>
  <button id="load">Load</button>
</div>
<div class="row">
  <label>Section <select id="section" disabled></select></label>
  <button id="one" disabled>Render section</button>
  <button id="whole" disabled>Render whole song</button>
</div>
<audio id="player" controls></audio>
<pre id="log"></pre>
<script type="module">
const FORM = ['intro', 'verse', 'refrain', 'turn', 'verse', 'refrain', 'turn', 'bridge', 'refrain', 'tag'];
const NATIVE = { '2': 'de0bce5b39452ee1d8f946f9b0c4d2f22ee83ee67daf9f8c240e1f773a81995b',
                 whole: '9b0766353b737cc66833d4e7b9423b136cedefeec15555d7f1931b38e6971beb' };
const $ = (id) => document.getElementById(id);
const log = (s) => { $('log').textContent += s + '\n'; };
FORM.forEach((name, i) => $('section').add(new Option(`${i}: ${name}`, String(i), false, i === 2)));
let worker = null, started = 0;
const busy = (b) => { for (const id of ['one', 'whole', 'section']) $(id).disabled = b; };
window.songbird = { results: [] };  // for automated checks
$('load').onclick = () => {
  $('load').disabled = true; $('mode').disabled = true;
  worker = new Worker('./worker.mjs', { type: 'module' });
  started = performance.now();
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.kind === 'log') log(m.msg);
    if (m.kind === 'error') { log('error: ' + m.msg); window.songbird.error = m.msg; busy(false); }
    if (m.kind === 'ready') { if (!window.songbird.loaded) { log(`ready in ${((performance.now() - started) / 1000).toFixed(1)}s`); window.songbird.loaded = true; } busy(false); }
    if (m.kind === 'done') {
      const same = NATIVE[m.which] ? (NATIVE[m.which] === m.id ? 'identical to the native render' : 'DIFFERS from the native render') : '';
      log(`${m.which === 'whole' ? 'whole song' : 'section ' + m.which}: ${m.seconds.toFixed(2)}s, wasm heap ${m.heap.toFixed(0)} MiB\n  ${m.info}\n  id ${m.id} ${same}`);
      window.songbird.results.push({ which: m.which, seconds: m.seconds, heap: m.heap, id: m.id, same });
      $('player').src = URL.createObjectURL(new Blob([m.wav], { type: 'audio/wav' }));
    }
  };
  log('loading…');
  worker.postMessage({ cmd: 'init', mode: $('mode').value, times: new URLSearchParams(location.search).has('times') });
};
$('one').onclick = () => { busy(true); log('rendering…'); worker.postMessage({ cmd: 'render', which: $('section').value }); };
$('whole').onclick = () => { busy(true); log('rendering the whole song…'); worker.postMessage({ cmd: 'render', which: 'whole' }); };
</script>
</body>
</html>
